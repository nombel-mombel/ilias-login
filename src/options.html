<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ILIAS Login Settings</title>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f6f8;
            color: #1f2933;
        }

        body {
            margin: 0;
            min-width: 280px;
            padding: 32px 20px;
        }

        main {
            max-width: 460px;
            margin: 0 auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #dbe3e8;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 24px;
            color: #52606d;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        form {
            display: grid;
            gap: 8px;
        }

        label {
            margin-top: 8px;
            color: #52606d;
            font-size: 0.82rem;
            font-weight: 600;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            color: #1f2933;
            font: inherit;
            outline: none;
            transition: border-color 120ms ease, box-shadow 120ms ease;
        }

        input:focus {
            border-color: #2f80ed;
            box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.16);
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            background: #1769aa;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }

        button:hover {
            background: #125a91;
        }

        button:focus-visible {
            outline: 3px solid rgba(47, 128, 237, 0.3);
            outline-offset: 2px;
        }

        button.success {
            background: #2f9e44;
        }

        button.success:hover {
            background: #27863a;
        }
    </style>
</head>

<body>
    <main>
        <h1>ILIAS Login</h1>
        <p>Store your KIT login details for automatic sign-in.</p>
        <form>
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" />
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" />
        </form>
        <button id="submit" type="button">Save settings</button>
    </main>
    <script src="options.js"></script>
</body>

</html>
<script src="options.js"></script>
